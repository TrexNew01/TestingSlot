<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Slot - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- សម្រាប់ Alert ស្អាតៗ -->
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: #0b0302;
            background-image: radial-gradient(circle at top, #260d07 0%, #050101 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; padding: 12px;
        }

        /* Header Bar - Glassmorphism Style */
        .user-card {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 440px;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 12px 16px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #000; font-size: 18px;
        }

        .user-name { font-weight: 700; font-size: 14px; color: #fff; }
        .user-id { font-size: 11px; color: #8a8a8a; }

        .balance-section {
            display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
        }

        .balance-badge {
            font-weight: bold; font-size: 18px; color: #2ecc71;
            text-shadow: 0 0 10px rgba(46,204,113,0.3);
        }

        .btn-deposit {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71; color: #2ecc71;
            padding: 4px 10px; border-radius: 8px; font-size: 11px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-deposit:active { transform: scale(0.9); background: #2ecc71; color: #000; }

        /* Premium Slot Frame */
        .slot-frame {
            background: linear-gradient(180deg, #3d1409 0%, #120402 100%);
            border: 3px solid #d4af37; border-radius: 16px; padding: 10px;
            width: 100%; max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .reels-container {
            display: flex; gap: 6px; background: #050202;
            padding: 8px; border-radius: 12px; border: 2px solid #5c2415;
        }

        .reel {
            flex: 1; display: flex; flex-direction: column; gap: 6px;
        }

        .symbol-box {
            width: 100%; height: 70px;
            background: #121010; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .symbol-img { max-width: 80%; max-height: 80%; object-fit: contain; }

        /* 🌀 Animations */
        .reel.spinning .symbol-box { animation: blurVertical 0.1s infinite linear; }
        @keyframes blurVertical {
            0% { transform: translateY(-5px); filter: blur(2px); }
            50% { transform: translateY(5px); filter: blur(2px); }
            100% { transform: translateY(-5px); filter: blur(2px); }
        }

        .win-glow {
            border-color: #ffd700 !important;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.5) !important;
        }

        /* Controls Area */
        .controls {
            width: 100%; max-width: 440px; margin-top: 15px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .dashboard-bar {
            display: flex; justify-content: space-between; gap: 10px;
        }

        .bet-box, .win-box {
            flex: 1; background: rgba(30, 10, 5, 0.8);
            border: 1px solid #8b5a2b; border-radius: 12px;
            padding: 8px; display: flex; align-items: center; justify-content: space-between;
        }

        .win-box { justify-content: center; flex-direction: column; }
        .win-label { font-size: 10px; color: #ffd700; letter-spacing: 1px; }
        .win-amount { font-size: 18px; font-weight: bold; color: #fff; }
        .win-amount.is-win { color: #2ecc71; text-shadow: 0 0 10px rgba(46,204,113,0.5); }

        .btn-bet {
            background: #4a280f; color: #fff; border: 1px solid #8b5a2b;
            width: 32px; height: 32px; border-radius: 50%;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn-bet:active { transform: scale(0.9); }

        .spin-btn {
            background: linear-gradient(180deg, #ffe066, #f39c12, #b33900);
            border: none; color: #000; font-size: 22px; font-weight: 900;
            padding: 14px; border-radius: 30px; cursor: pointer;
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.4); text-transform: uppercase;
        }
        .spin-btn:active { transform: scale(0.96); }
        .spin-btn:disabled { opacity: 0.5; filter: grayscale(1); }

        .alert-box { color: #e74c3c; font-size: 13px; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

    <div class="user-card">
        <div class="user-info">
            <div class="user-avatar" id="u-avatar">?</div>
            <div class="user-details">
                <span class="user-name" id="u-name">Loading...</span>
                <span class="user-id" id="u-id">ID: -----</span>
            </div>
        </div>
        <div class="balance-section">
            <div class="balance-badge" id="balance-display">$10.00</div>
            <button class="btn-deposit" onclick="testDeposit()">➕ ដាក់ប្រាក់</button>
        </div>
    </div>

    <div class="slot-frame">
        <div class="reels-container" id="slot-grid">
            <div class="reel" id="reel-0"></div>
            <div class="reel" id="reel-1"></div>
            <div class="reel" id="reel-2"></div>
            <div class="reel" id="reel-3"></div>
            <div class="reel" id="reel-4"></div>
        </div>
    </div>

    <div class="controls">
        <div class="dashboard-bar">
            <div class="bet-box">
                <button class="btn-bet" onclick="changeBet(-0.10)">-</button>
                <div style="text-align: center;">
                    <div style="font-size: 10px; color: #aaa;">TOTAL BET</div>
                    <div id="bet-display" style="font-size: 16px; font-weight: bold; color: #ffd700;">$0.10</div>
                </div>
                <button class="btn-bet" onclick="changeBet(0.10)">+</button>
            </div>
            
            <div class="win-box">
                <span class="win-label">WIN</span>
                <span class="win-amount" id="win-display">$0.00</span>
            </div>
        </div>

        <button class="spin-btn" id="spin-btn" onclick="spin()">SPIN</button>
        <div class="alert-box" id="alert-msg"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        const tg = window.Telegram?.WebApp;
        let userBalance = 10.00;
        let currentBet = 0.10;
        let isSpinning = false;

        let userData = { id: 123456, first_name: "Trex User", username: "trex_user" };

        if (tg) {
            tg.expand(); tg.ready();
            if (tg.initDataUnsafe?.user) userData = tg.initDataUnsafe.user;
        }

        document.getElementById('u-name').innerText = userData.first_name;
        document.getElementById('u-id').innerText = `ID: ${userData.id}`;
        document.getElementById('u-avatar').innerText = userData.first_name.charAt(0).toUpperCase();

        const symbolImages = {
            'WILD': 'https://img.icons8.com/emoji/96/dragon-face-emoji.png',
            'BONUS': 'https://img.icons8.com/color/96/gold-bars.png',
            'INGOT': 'https://img.icons8.com/color/96/chinese-money-bag.png',
            'ENVELOPE': 'https://img.icons8.com/color/96/red-envelope.png',
            'PIXIU': 'https://img.icons8.com/color/96/lion-statue.png',
            'LION': 'https://img.icons8.com/color/96/tiger-face.png',
            'FISH': 'https://img.icons8.com/color/96/koi-fish.png',
            'A': 'https://img.icons8.com/color-glass/96/letter-a.png',
            'K': 'https://img.icons8.com/color-glass/96/letter-k.png',
            'Q': 'https://img.icons8.com/color-glass/96/letter-q.png',
            'J_10': 'https://img.icons8.com/color-glass/96/letter-j.png'
        };
        const allSymbols = Object.keys(symbolImages);

        function initGrid() {
            for (let i = 0; i < 5; i++) {
                const reel = document.getElementById(`reel-${i}`);
                reel.innerHTML = '';
                for (let j = 0; j < 3; j++) {
                    const box = document.createElement('div');
                    box.className = 'symbol-box';
                    box.innerHTML = `<img class="symbol-img" src="${symbolImages['A']}">`;
                    reel.appendChild(box);
                }
            }
        }
        initGrid();

        function changeBet(step) {
            if (isSpinning) return;
            let newBet = Math.round((currentBet + step) * 100) / 100;
            if (newBet >= 0.10 && newBet <= 10.00) {
                currentBet = newBet;
                document.getElementById('bet-display').innerText = `$${currentBet.toFixed(2)}`;
            }
        }

        // មុខងារដាក់ប្រាក់ Test 
        async function testDeposit() {
            if (isSpinning) return;
            
            try {
                const res = await fetch(`${API_URL}/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userData.id, amount: 10.00 })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    userBalance = data.balance;
                    document.getElementById('balance-display').innerText = `$${userBalance.toFixed(2)}`;
                    
                    // បង្ហាញ Alert ស្អាតៗ
                    Swal.fire({
                        title: 'ជោគជ័យ!',
                        text: data.message,
                        icon: 'success',
                        confirmButtonColor: '#2ecc71',
                        background: '#1a1a1a',
                        color: '#fff'
                    });
                    document.getElementById('alert-msg').innerText = ''; // Clear error msg
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function spin() {
            const alertMsg = document.getElementById('alert-msg');
            const winDisplay = document.getElementById('win-display');
            alertMsg.innerText = "";
            winDisplay.innerText = "$0.00";
            winDisplay.classList.remove('is-win');

            if (userBalance < currentBet) {
                alertMsg.innerHTML = "❌ ប្រាក់មិនគ្រប់គ្រាន់ទេ! សូមចុច <b>➕ ដាក់ប្រាក់</b> ដើម្បីបន្ត (Test Mode)។";
                return;
            }

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.querySelectorAll('.symbol-box').forEach(b => b.classList.remove('win-glow'));

            const reels = document.querySelectorAll('.reel');
            reels.forEach(r => r.classList.add('spinning'));

            const spinInterval = setInterval(() => {
                reels.forEach(reel => {
                    const imgs = reel.querySelectorAll('.symbol-img');
                    imgs.forEach(img => {
                        img.src = symbolImages[allSymbols[Math.floor(Math.random() * allSymbols.length)]];
                    });
                });
            }, 60);

            try {
                const response = await fetch(`${API_URL}/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userData.id, bet_amount: currentBet })
                });
                const data = await response.json();

                if (data.status === "error") {
                    clearInterval(spinInterval);
                    reels.forEach(r => r.classList.remove('spinning'));
                    alertMsg.innerHTML = `❌ ${data.message}`;
                    document.getElementById('spin-btn').disabled = false;
                    isSpinning = false;
                    return;
                }

                setTimeout(() => {
                    clearInterval(spinInterval);
                    data.grid.forEach((reelSymbols, reelIndex) => {
                        setTimeout(() => {
                            const reelDiv = document.getElementById(`reel-${reelIndex}`);
                            reelDiv.classList.remove('spinning');
                            reelDiv.innerHTML = '';
                            
                            reelSymbols.forEach(symbol => {
                                const box = document.createElement('div');
                                box.className = 'symbol-box';
                                if (data.total_win > 0) box.classList.add('win-glow');
                                box.innerHTML = `<img class="symbol-img" src="${symbolImages[symbol]}">`;
                                reelDiv.appendChild(box);
                            });

                            if (reelIndex === 4) {
                                userBalance = data.balance;
                                document.getElementById('balance-display').innerText = `$${userBalance.toFixed(2)}`;

                                if (data.total_win > 0) {
                                    winDisplay.innerText = `$${data.total_win.toFixed(2)}`;
                                    winDisplay.classList.add('is-win');
                                }
                                document.getElementById('spin-btn').disabled = false;
                                isSpinning = false;
                            }
                        }, reelIndex * 150);
                    });
                }, 500);

            } catch (err) {
                clearInterval(spinInterval);
                reels.forEach(r => r.classList.remove('spinning'));
                alertMsg.innerText = "⚠️ មិនអាចភ្ជាប់ទៅ Server ទេ!";
                document.getElementById('spin-btn').disabled = false;
                isSpinning = false;
            }
        }
    </script>
</body>
</html>
