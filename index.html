<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T-Spin Studios - ជ្រើសរើសហ្គេម</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050101;
    --bg-warm:#260d07;
    --gold:#ffd700;
    --gold-dim:#b89b6a;
    --jade:#2ecc71;
    --crimson:#c0392b;
    --card-bg:rgba(20,10,5,0.55);
    --card-border:rgba(212,175,55,0.45);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg-deep);
    background-image:
      radial-gradient(circle at 50% -10%, #3a1408 0%, #170804 45%, #050101 100%);
    color:#fff;
    font-family:'Noto Sans Khmer','Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 40px;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- ambient embers (signature atmosphere, quiet) ---------- */
  .ember{
    position:fixed; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background:var(--gold); opacity:0; pointer-events:none;
    box-shadow:0 0 6px 1px rgba(255,215,0,0.6);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.7; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-100vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ---------- header ---------- */
  .mascot-wrap{
    width:160px; height:160px; margin-bottom:8px; position:relative;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,0.65));
  }
  /* 🌟 ពន្លឺទន់ៗពីក្រោយ logo ធ្វើឱ្យវាលេចធ្លោច្បាស់លើផ្ទៃងងឹត */
  .mascot-wrap::before{
    content:""; position:absolute; inset:-16px; z-index:-1;
    background:radial-gradient(circle, rgba(255,215,0,0.22) 0%, rgba(255,215,0,0) 70%);
  }
  .mascot-wrap img{ width:100%; height:100%; object-fit:contain; }

  .brand-eyebrow{
    font-family:'Noto Sans Khmer'; font-size:12px; letter-spacing:2px; color:var(--gold-dim);
    margin-bottom:2px;
  }
  h1.brand{
    font-family:'Cinzel', serif; font-weight:700; font-size:30px; letter-spacing:4px;
    color:var(--gold);
    background:linear-gradient(180deg,#fff2b0 0%,#ffd700 45%,#a97a1f 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 2px 18px rgba(255,215,0,0.25);
    margin-bottom:4px;
  }
  .brand-sub{
    font-size:13px; color:#e8d9b8; opacity:0.85; text-align:center; max-width:320px;
    margin-bottom:26px;
  }

  /* ---------- game grid ---------- */
  .grid{
    width:100%; max-width:440px;
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .grid .card:first-child{ grid-column:1 / -1; }

  .card{
    position:relative;
    background:var(--card-bg);
    backdrop-filter:blur(10px);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:20px 14px 16px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    text-decoration:none; color:inherit;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:active{ transform:scale(0.97); }
  .card.live{ cursor:pointer; }
  .card.live:hover{ border-color:rgba(255,215,0,0.75); box-shadow:0 6px 24px rgba(255,215,0,0.15); }

  /* the tassel cord — small signature nod to the envelope/bonus icon set */
  .cord{
    position:absolute; top:-9px; width:2px; height:16px;
    background:linear-gradient(var(--crimson), transparent);
  }

  /* octagonal moon-gate medallion, echoing the symbol-icon bezel */
  .medallion{
    --size:84px;
    width:var(--size); height:var(--size); margin-bottom:12px;
    position:relative;
    clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
    background:linear-gradient(160deg,#3a2410,#150a04);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(255,215,0,0.55), 0 3px 10px rgba(0,0,0,0.5);
  }
  .medallion img{ width:62%; height:62%; object-fit:contain; }
  .medallion .lock{ font-size:26px; opacity:0.55; filter:grayscale(1); }

  .card.soon .medallion{
    box-shadow:inset 0 0 0 2px rgba(184,155,106,0.35), 0 3px 10px rgba(0,0,0,0.5);
    filter:saturate(0.35) brightness(0.75);
  }

  .card-title{ font-weight:700; font-size:14.5px; letter-spacing:0.3px; margin-bottom:2px; }
  .card-title.small{ font-size:13px; }
  .card-tag{ font-size:10.5px; color:var(--gold-dim); margin-bottom:12px; }

  .play-btn{
    width:100%; padding:9px 0; border-radius:10px; border:none;
    font-weight:800; font-size:12.5px; letter-spacing:0.4px;
    background:linear-gradient(180deg,#ffe066,#d4a017); color:#2a1600;
    box-shadow:0 3px 10px rgba(212,160,23,0.35);
  }
  .soon-badge{
    width:100%; padding:9px 0; border-radius:10px;
    font-weight:700; font-size:11px; letter-spacing:0.4px;
    background:rgba(255,255,255,0.05); color:var(--gold-dim);
    border:1px dashed rgba(184,155,106,0.4);
  }

  /* subtle rotating sheen sweep across the live medallion */
  .medallion.sheen::after{
    content:""; position:absolute; inset:0;
    background:conic-gradient(from 0deg, transparent 0 80%, rgba(255,255,255,0.35) 88%, transparent 96%);
    animation:sweep 5s linear infinite;
    mix-blend-mode:overlay;
  }
  @keyframes sweep{ to{ transform:rotate(360deg); } }

  footer{
    margin-top:30px; font-size:10.5px; color:var(--gold-dim); opacity:0.6; letter-spacing:0.3px;
  }

  /* ---------- slot-reel loading overlay ---------- */
  .loader-overlay{
    position:fixed; inset:0; z-index:999;
    background:radial-gradient(circle at 50% 40%, #2a0f06 0%, #0a0302 65%, #050101 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .loader-overlay.show{ opacity:1; pointer-events:all; }

  .loader-title{
    font-family:'Cinzel', serif; font-weight:700; font-size:15px; letter-spacing:3px;
    color:var(--gold); margin-bottom:22px; text-transform:uppercase;
    text-shadow:0 2px 14px rgba(255,215,0,0.35);
  }

  .reels{
    display:flex; gap:10px; margin-bottom:26px;
    padding:12px; border-radius:14px;
    background:linear-gradient(160deg,#3a2410,#150a04);
    box-shadow:inset 0 0 0 2px rgba(255,215,0,0.5), 0 8px 24px rgba(0,0,0,0.6);
  }
  .reel{
    width:52px; height:52px; border-radius:8px; overflow:hidden;
    background:#0d0603;
    box-shadow:inset 0 0 0 1px rgba(255,215,0,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .reel img{ width:70%; height:70%; object-fit:contain; animation:spin-symbol .18s linear infinite; }
  .reel:nth-child(2) img{ animation-delay:.06s; }
  .reel:nth-child(3) img{ animation-delay:.12s; }
  @keyframes spin-symbol{
    0%{ transform:translateY(-60%); opacity:0; }
    50%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(60%); opacity:0; }
  }

  .loader-bar-track{
    width:200px; height:6px; border-radius:6px; overflow:hidden;
    background:rgba(255,255,255,0.08);
    box-shadow:inset 0 0 0 1px rgba(212,175,55,0.3);
  }
  .loader-bar-fill{
    height:100%; width:0%; border-radius:6px;
    background:linear-gradient(90deg,#ffe066,#d4a017);
    transition:width .1s linear;
  }
  .loader-hint{ margin-top:14px; font-size:11.5px; color:var(--gold-dim); letter-spacing:0.3px; }
</style>
</head>
<body>

  <div class="mascot-wrap"><img src="T-spinLogo.png" alt=""></div>
  <div class="brand-eyebrow">✦ FORTUNE HALL ✦</div>
  <h1 class="brand">T-Spin Studios</h1>
  <div class="brand-sub">ជ្រើសរើសហ្គេមដែលអ្នកចង់លេង — ហ្គេមថ្មីៗនឹងបន្ថែមនៅទីនេះឆាប់ៗនេះ</div>

  <div class="grid" id="game-grid"></div>

  <footer>T-Spin Studios © 2026</footer>

  <div class="loader-overlay" id="loader-overlay">
    <div class="loader-title" id="loader-title">កំពុងផ្ទុកហ្គេម...</div>
    <div class="reels">
      <div class="reel"><img src="INGOT.png" alt=""></div>
      <div class="reel"><img src="LION.png" alt=""></div>
      <div class="reel"><img src="PIXIU.png" alt=""></div>
    </div>
    <div class="loader-bar-track"><div class="loader-bar-fill" id="loader-bar"></div></div>
    <div class="loader-hint">សូមរង់ចាំបន្តិច</div>
  </div>

<script>
  // ✦ បញ្ជីហ្គេម — បន្ថែម object ថ្មីមួយនៅទីនេះរាល់ពេលមានហ្គេមថ្មី
  // status: "live" = អាចលេងបាន, "soon" = មកដល់ឆាប់ៗ (medallion បង្ហាញជា lock)
  const GAMES = [
    {
      id: "golden-dragon-fortune",
      title: "Golden Dragon Fortune",
      tag: "Premium Fortune Slot · 5×3",
      icon: "GoldenDragon.png",
      status: "live",
      url: "Golden_Dragon_Fortune.html"
    },
    {
      id: "coming-1",
      title: "?",
      tag: "មកដល់ឆាប់ៗ",
      status: "soon"
    },
    {
      id: "coming-2",
      title: "?",
      tag: "មកដល់ឆាប់ៗ",
      status: "soon"
    }
  ];

  const grid = document.getElementById("game-grid");

  GAMES.forEach(game => {
    const isLive = game.status === "live";
    const el = document.createElement(isLive ? "a" : "div");
    el.className = "card " + (isLive ? "live" : "soon");
    if (isLive) el.href = game.url;

    el.innerHTML = `
      <span class="cord"></span>
      <div class="medallion ${isLive ? "sheen" : ""}">
        ${isLive
          ? `<img src="${game.icon}" alt="${game.title}">`
          : `<span class="lock">🔒</span>`}
      </div>
      <div class="card-title ${isLive ? "" : "small"}">${game.title}</div>
      <div class="card-tag">${game.tag}</div>
      ${isLive
        ? `<span class="play-btn">លេងឥឡូវ</span>`
        : `<span class="soon-badge">COMING SOON</span>`}
    `;

    if (isLive) {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        playLoaderThenGo(game);
      });
    }

    grid.appendChild(el);
  });

  // ✦ ចាក់ animation slot-reel រហូតដល់ 100% រួចទើប navigate ទៅហ្គេម
  function playLoaderThenGo(game) {
    const overlay = document.getElementById("loader-overlay");
    const bar = document.getElementById("loader-bar");
    const title = document.getElementById("loader-title");
    title.textContent = `កំពុងផ្ទុក ${game.title}...`;
    bar.style.width = "0%";
    overlay.classList.add("show");

    let progress = 0;
    const totalDuration = 1300; // ms
    const stepMs = 40;
    const steps = totalDuration / stepMs;
    const increment = 100 / steps;

    const timer = setInterval(() => {
      progress = Math.min(100, progress + increment);
      bar.style.width = progress + "%";
      if (progress >= 100) {
        clearInterval(timer);
        window.location.href = game.url;
      }
    }, stepMs);
  }

  // ✦ ភ្លើងអង្គុលចេញពីបាតអេក្រង់ (ambient, light, respects reduced-motion via CSS)
  const emberLayer = document.body;
  for (let i = 0; i < 14; i++) {
    const e = document.createElement("div");
    e.className = "ember";
    e.style.left = Math.random() * 100 + "vw";
    e.style.setProperty("--drift", (Math.random() * 40 - 20) + "px");
    e.style.animationDuration = (6 + Math.random() * 6) + "s";
    e.style.animationDelay = (Math.random() * 8) + "s";
    emberLayer.appendChild(e);
  }

  // ✦ Telegram Web App — ពង្រីកទៅពេញអេក្រង់ដូច slot_game.html
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
</script>
</body>
</html>
